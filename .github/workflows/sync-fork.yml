name: Sync fork (Vercel deploy source)

# prev-live/prev-live의 main이 바뀔 때마다 Vercel이 보고 있는 개인 포크
# (numberonekkaebi/prev-live)의 main으로 그대로 밀어서, 머지=자동 배포가 되게 한다.
# 포크는 GitHub 조직 프라이빗 레포를 Vercel Hobby(무료)로 배포하기 위한 우회 방법이라
# 필요함 — Vercel Hobby는 org 소속 프라이빗 레포에서 직접 배포를 지원하지 않는다.
#
# 서드파티 액션(cpina/github-action-push-to-another-repository)은 강제 push 옵션이
# 없어 포크 쪽에 남은 디버깅용 테스트 커밋과 히스토리가 갈라지면(non-fast-forward) 실패함.
# 원인 규명 후 직접 git push --force로 단순화(미러 용도라 포크 쪽 독자 커밋은 보존 불필요).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout이 남기는 임시 인증 헤더(.git/config의 http.https://github.com/.extraheader)가
      # 아래 push 단계의 토큰보다 우선 적용돼 "Repository not found"가 남 —
      # 원인: github.com/cpina/github-action-push-to-another-repository issue #75.
      - name: Remove checkout's auth header override
        run: git config --unset-all http.https://github.com/.extraheader

      # Vercel Hobby는 "commit author가 프로젝트 소유 계정과 다르면" private 레포 배포를
      # 막는다("does not support collaboration for private repositories"). prev-live/prev-live에
      # 커밋한 사람은 numberonekkaebi 계정이 아니므로, 포크로 밀기 전에 author를 numberonekkaebi
      # 본인 계정으로 다시 씌운다(원본 저장소 히스토리에는 영향 없음, 이 러너의 임시 체크아웃에만 적용).
      - name: Rewrite commit author to fork owner
        run: |
          git config user.name "numberonekkaebi"
          git config user.email "310057774+numberonekkaebi@users.noreply.github.com"
          git commit --amend --no-edit --author="numberonekkaebi <310057774+numberonekkaebi@users.noreply.github.com>"

      - name: Force-push to fork
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git push --force "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/numberonekkaebi/prev-live.git" HEAD:main
