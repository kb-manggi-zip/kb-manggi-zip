[project]
name = "kb-manki-backend"
version = "0.1.0"
description = "KB 만기상담소 백엔드 — 세 갈래(갱신·이사·매매) 비교 에이전트"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120  # 한글 문장·SQL 문자열이 길어서 여유 있게
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, import 정렬
