# 규제지역 / 수도권 매핑 (신규 — B1.5 리서치 반영)
# 출처: 260630 투기과열지구·조정대상지역 추가지정(주택정책과) / 251015 주택시장 안정화 대책
# checked_at: 2026-07-20
#
# ⚠️ 스펙 pseudocode는 region_name에 "서울" 문자열이 있어야 규제로 판정하지만,
#    데모 동네 이름은 "마포구 합정동"처럼 시(市)가 빠져 있어 매칭 실패한다.
#    → seoul_gu(25 자치구) 목록을 추가해 구 이름으로도 서울=규제 판정되게 보완했다.

regulated:
  seoul_all: true          # 서울특별시 전역 25개 자치구 = 규제
  gyeonggi:                # 경기 규제지역 (조정대상/투기과열)
    - 수원시 장안구
    - 수원시 팔달구
    - 수원시 영통구
    - 성남시 수정구
    - 성남시 중원구
    - 성남시 분당구
    - 안양시 동안구
    - 과천시
    - 용인시 수지구
    - 용인시 기흥구
    - 광명시
    - 하남시
    - 의왕시
    - 화성시 동탄구
    - 구리시

# 서울 25 자치구 (구 이름만으로 서울 판정용 — 보완 추가분)
seoul_gu:
  - 종로구
  - 중구
  - 용산구
  - 성동구
  - 광진구
  - 동대문구
  - 중랑구
  - 성북구
  - 강북구
  - 도봉구
  - 노원구
  - 은평구
  - 서대문구
  - 마포구
  - 양천구
  - 강서구
  - 구로구
  - 금천구
  - 영등포구
  - 동작구
  - 관악구
  - 서초구
  - 강남구
  - 송파구
  - 강동구

metro:                     # 수도권 = 서울·경기·인천 전역
  - 서울
  - 경기
  - 인천

# 실거래 수집 대상 시군구 (법정동코드 앞 5자리) — refresh_deals.py가 이 목록을 돈다.
# 전부 서울 = 규제지역 (위 regulated.seoul_all 과 정합).
