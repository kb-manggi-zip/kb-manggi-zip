# HUG 전세보증금반환보증 보증료율 (신규 — B1.5 리서치 반영, 3중 테이블)
# ⚠️ 기존 guarantee.yaml(단일 요율)은 working compare가 쓰므로 유지. 이 파일은 v2.
# 출처: HUG khug.or.kr/hug/web/ig/dr/igdr000008.jsp
# 산식: 보증료 = 보증금액 × 보증료율 × (계약일수/365).  월환산 = 보증금 × 요율 / 12
# ✅ checked_at: 2026-07-20 (ref/rules_확정값_실데이터반영용.md — 리서치_3 셀 단위 대조 완료, 값 유지 확정)
#   아파트 기준: 9천만↓ 80%이하 0.115% / 9천만~2억·2억↑ 80%이하 0.122% / 전구간 80%초과 0.128%
# ✅ checked_at: 2026-07-27 — 연립·다세대(other) 요율 HUG 공식 페이지(khug.or.kr) 직접 대조 완료.
#   HUG는 주택유형을 "아파트" vs "기타" 2가지로만 구분(연립·다세대·단독·다가구가 전부 "기타" 하나로 묶임).
#   예시 대조: 2억원 이상·부채비율 80%이하 "기타" 0.146% — 아래 other 값(0.00146)과 정확히 일치.
#   주택유형 매핑: 아파트=apartment, 연립다세대=other (compare가 housingType로 분기).
#    단독·다가구(detached)는 서비스 범위 밖(제외) — 건물 전체 근저당·선순위 보증금 산정 불가.
#    detached 값은 HUG 분류상 other와 동일 요율(참고용으로만 남겨둠, 코드에서 미사용).

hug_fee_rate:
  # [보증금 구간][주택유형][부채비율 le80 / gt80]
  under_90m:                    # 9천만원 이하
    apartment: {le80: 0.00115, gt80: 0.00128}
    detached:  {le80: 0.00139, gt80: 0.00154}
    other:     {le80: 0.00139, gt80: 0.00154}
  m90_to_200m:                  # 9천만 초과 ~ 2억 이하
    apartment: {le80: 0.00122, gt80: 0.00128}
    detached:  {le80: 0.00146, gt80: 0.00154}
    other:     {le80: 0.00146, gt80: 0.00154}
  over_200m:                    # 2억 초과
    apartment: {le80: 0.00122, gt80: 0.00128}
    detached:  {le80: 0.00146, gt80: 0.00154}
    other:     {le80: 0.00146, gt80: 0.00154}

default_house_type: apartment   # PoC 가정 (assumptions에 노출)
default_debt_ratio: le80        # 부채비율 80% 이하 가정 (assumptions에 노출)
contract_days: 730              # 2년 계약
