# 전세가율 구간 판정 기준 — 실거래 기반(예측·ML 아님, trades.db 나눗셈)
#
# 출처: HUG 전세보증금반환보증 가입요건 — 담보인정비율 90%.
#   산식(원문): 보증한도 = 주택가격 × 담보인정비율(90%) − 선순위채권 등
#   주택가격 산정: 아파트=기관 시세(KB시세 등), 연립·다세대=공시가격 × 140%
#   적용: 신규 2023.8.31~, 갱신도 2024.1.1~ 90% 적용 (100%→90% 강화)
#   source_url(상품): https://www.khug.or.kr/hug/web/ig/dr/igdr000001.jsp
#                     (모바일 https://www.khug.or.kr/khmb/m/hg/gg/hggg000002_0.jsp)
#   source_url(FAQ·산식): https://www.khug.or.kr/hug/web/ig/dr/igdr000003.jsp?tabMenu=Yfaq
# checked_at: 2026-07-27 (사람 확인 완료)
# ⚠️ 2024년 말 90%→80% 하향 검토 보도 있음 — 발표 직전 재확인.
#
# ⚠️ 우리 지표는 'HUG 가입 판정'이 아니다: HUG는 선순위 채권 포함 + 기관 산정 주택가격 기준이고,
#    이 지표는 보증금 ÷ 실거래 매매 중위가(선순위 미반영)로 계산한 **참고 지표**다.
checked_at: "2026-07-27"
source_url: "https://www.khug.or.kr/hug/web/ig/dr/igdr000001.jsp"

# ratio(=보증금÷매매중위가)가 max 이하이면 해당 구간. 위에서부터 매칭.
bands:
  - {max: 0.70, level: safe,    label: "여유 구간"}
  - {max: 0.90, level: caution, label: "반환보증 가입을 권장하는 구간"}
  - {max: 9.99, level: alert,   label: "반환보증 가입이 어려울 수 있는 구간 (HUG 90% 기준 초과)"}
