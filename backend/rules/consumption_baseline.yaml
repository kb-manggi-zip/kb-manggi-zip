# 소비 성향 '실측 override' 기준 — 개인 실측 비중을 또래 평균과 비교하는 baseline.
#
# 증거 위계(강한 증거가 약한 증거를 덮어씀):
#   1위 본인 진술+HITL 확정  2위 개인 실측(mydata)  3위 세그먼트 통계(spending_profiles)
# 이 파일은 2위 판정용 — 개인 카테고리 비중 ÷ 또래 평균 비중이 임계를 넘으면 성향 override.
#
# 또래 평균 비중: 카드통계 일반 분포 근사(PoC). 실서비스는 연령×가구 세그먼트 비중으로 교체.
# 임계 ±30%: 소폭 편차는 노이즈로 보고 세그먼트 값 유지(보수적 반영).
checked_at: null   # 🔴 실서비스 전 카드통계 세그먼트 비중으로 교체·검증

threshold_high: 1.3   # 또래 평균의 1.3배↑ → high override
threshold_low: 0.7    # 또래 평균의 0.7배↓ → low override

# 총지출 대비 카테고리 비중(또래 평균 근사). 고정지출(주거·보험·구독·교통)은 성향 아님 → 제외.
baseline_ratio:
  카페: 0.045
  배달: 0.060
  식비: 0.160
  쇼핑: 0.130
  여가: 0.110
