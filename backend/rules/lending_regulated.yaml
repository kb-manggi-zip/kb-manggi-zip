# 대출 규제·한도·금리 — 리서치 PDF 원문 대조 확정본
# 출처: 금융위 '26 가계부채 관리방안(fsc.go.kr/po010101/87222, 리서치_1) / obank.kbstar.com(리서치_5) / HF 공시(2026-07-06~07-12, 리서치_2)
# ✅ checked_at: 2026-07-20 (ref/rules_확정값_실데이터반영용.md — 셀 단위 대조 완료)

ltv:
  # [비규제, 규제] — 무주택 기준
  no_house:       {non_regulated: 0.70, regulated: 0.40}
  first_home:     {non_regulated: 0.80, regulated: 0.70}   # 정책상품·가격·소득요건별 상이
  one_house_swap: {non_regulated: 0.70, regulated: 0.40}   # 기존주택 처분조건
  multi_house:    {non_regulated: 0.60, regulated: 0.30}   # PoC 미구현(타깃 외)

mortgage_cap:
  gov_metro: 600000000        # 정부: 수도권·규제지역 주택구입 주담대 절대한도 (2025.6~)
  kb_purchase: 300000000      # KB 자체 정책 (2026.7.10~) — 집단/정책모기지/보금자리론 제외
  # 적용: min(LTV한도, DSR한도, gov_metro, kb_purchase). 정책대출(디딤돌)분은 kb_purchase 캡에서 제외.

dsr:
  cap: 0.40                   # 은행권
  # 스트레스 DSR 3단계 최종 = stress_rate × base_ratio × loan_type_ratio
  stress_rate:
    metro_regulated: 0.030    # 수도권·규제지역 (10.15 대책)
    local_regulated: 0.015    # 지방 규제지역
    others: 0.015
  base_ratio: 1.00            # 3단계 100%
  loan_type_ratio:
    variable: 1.00            # 변동 100%
    # ⚠️ 혼합·주기형 적용비율(<표2>)은 원문 미확보 → 보수적으로 변동과 동일(1.00) 처리.
    #    실제로는 완화되어 한도가 늘 수 있음(과소추정 = 안전 방향). (기존 추정치 0.60/0.30 제거)
    mixed: 1.00
    periodic: 1.00
  default_loan_type: variable   # PoC 기본: 변동(가장 보수적) → compare는 variable(1.00)만 사용

loan_term_years: 30

rates:
  kb_mortgage_mixed_min: 0.0520   # 혼합 금융채5년 최저
  kb_mortgage_var_min:   0.0410   # 변동 신규COFIX12M 최저
  kb_mortgage_default:   0.0410   # PoC 표시 기본값(변동 최저)
  jeonse_kb:  0.0389              # HF 전세대출금리 공시상 은행평균(KB 취급분). KB 상품 최저는 3.81%(신규COFIX6M)
  jeonse_min: 0.0374              # 시장 최저(카카오뱅크) — 범위 표기용
  jeonse_max: 0.0538              # 시장 최고(경남은행) — 범위 표기용

jeonse_limit:
  ratio: 0.80                 # 임차보증금의 80% 이내
  base: 222000000             # KB 전세자금대출 최고 (임차보증금 80% 이내)
  secured: 444000000          # 채권보전조치 시
  one_house_metro: 200000000  # 2025.9.8 이후 계약 수도권·규제지역 1주택자 캡 (무주택 타깃엔 미적용)
  # 적용: min(보증금×ratio, base). 수도권 1주택이면 one_house_metro 캡.

# 생애최초 취득세 감면 (지방세특례제한법 §36의3)
# ✅ checked_at: 2026-07-26 — 2028.12.31까지 연장 확정, 취득가 12억↓ 200만원 한도, 소득제한 없음.
#    (전용 60㎡↓·수도권6억/지방3억↓ 소형은 300만원 한도 / 추징: 3개월내 전입+3년 거주)
#    출처: 지특법 §36의3(law.go.kr), 법률신문 2026.2 개정정리. → compare에서 firstHome '예'면 -200만 적용.
# ⚠️ PoC 단순화: 12억 가격상한·소형 300만 구분은 미반영(데모가는 전부 12억↓라 결과 동일).
first_home_acq_reduction: 2000000   # 최대 200만원 (12억↓ 기준)
