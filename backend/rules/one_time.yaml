# 일회성 비용 — 이사비/중개보수/취득세 등 부대비용 요율
# ⚠️ 예시값. 공인중개사법 시행규칙·지방세법으로 검증 필요.

# TODO(다음 세션): 이사비는 사실 "갈래(매매/이사)"가 아니라 "주택유형(아파트/연립다세대)"이
# 결정하는 비용이다 — 매매든 이사든 이사 물리 과정은 같고, 평수 차이가 비용을 가른다.
# housingType 입력 필드가 이제 생겼으니(schemas.py), move_base를 갈래가 아니라 유형 기준으로
# 재배정할 것 (아파트→1,200,000 / 연립다세대→800,000, 갈래 무관하게 동일 적용). 아직 미착수.
move_base:
  value: 800000         # 이사 기본 비용(원) — 원룸~투룸 포장이사 비수기~성수기 평균, "이사" 갈래용
  source_url: "https://miso.kr/blog/투룸-포장이사-비용"
  checked_at: "2026-07-26"
  note: "법정 수치 아님, 2026년 포장이사 시세 조사 기준(시세 참고치). 원룸 30~50만원, 투룸 50~110만원(성수기 약 90만원) — 그 중간값. 이전 150만원은 투룸 성수기 수준이라 다소 높았음. ⚠️ 실질은 '연립다세대' 기준값 — 갈래 기준 임시 배정, 위 TODO 참고."

move_base_buy:
  value: 1200000         # 매매 갈래 이사 기본 비용(원) — 20평대~30평대 초반 아파트 포장이사 기준
  source_url: "https://www.ajd.co.kr/contents/basic-tip/detail/%EC%95%84%ED%8C%8C%ED%8A%B8_%EC%9D%B4%EC%82%AC%EB%B9%84%EC%9A%A9_%ED%8F%89%EC%88%98_%EB%B3%84_%EC%99%84%EB%B2%BD_%EC%A0%95%EB%A6%AC_:_18%ED%8F%89,20%ED%8F%89,24%ED%8F%89,34%ED%8F%89-38341"
  checked_at: "2026-07-26"
  note: "법정 수치 아님, 2026년 포장이사 시세 조사 기준. 20평대 100~110만원, 30평대 130~140만원 — 매매 갈래 대상(생애최초·무주택, 수도권 규제지역)이 보통 이 구간대 서울 아파트라고 가정해 그 중간값. 평수·방 개수를 입력받지 않아 구간표 대신 단일값. ⚠️ 실질은 '아파트' 기준값 — 갈래 기준 임시 배정, 위 TODO 참고."

# 중개보수 — 서울특별시 주택 중개보수 등에 관한 조례(서울특별시조례 제8585호) 별표1, 임대차(전월세) 기준.
# 데모 동네가 전부 서울(§7 계산로직 문서)이라 이 조례 하나로 충분. "이사" 갈래에서 deposit 기준 조회.
broker_rate_bands:
  source_url: "https://land.seoul.go.kr/land/broker/brokerageCommission.do"
  checked_at: "2026-07-26"
  note: "law.go.kr 공인중개사법 시행규칙 별표1 원문 직접 대조 완료(사용자 확인, 2026-07-26). <개정 2021.12.30.>. 2025~2026 재개정 없음(재검증일 기준). 이전엔 단일 근사값(0.004, 6~12억 구간)을 썼으나, 데모 보증금대(1억~6억)는 실제로 0.3% 구간에 해당해 구간표로 교체."
  bands:
    - upto: 50000000       # 5천만원 미만
      rate: 0.005
      cap: 200000
    - upto: 100000000      # 5천만원 ~ 1억원 미만
      rate: 0.004
      cap: 300000
    - upto: 600000000      # 1억원 ~ 6억원 미만
      rate: 0.003
      cap: null
    - upto: 1200000000     # 6억원 ~ 12억원 미만
      rate: 0.004
      cap: null
    - upto: 1500000000     # 12억원 ~ 15억원 미만
      rate: 0.005
      cap: null
    - upto: null           # 15억원 이상
      rate: 0.006
      cap: null

# 중개보수(매매·교환) — 공인중개사법 시행규칙 별표1, "매매·교환" 기준(임대차와 다른 표).
# law.go.kr 원문 사용자 직접 대조 완료(2026-07-26). "매매" 갈래에서 max_price 기준 조회.
broker_rate_bands_purchase:
  source_url: "https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B3%B5%EC%9D%B8%EC%A4%91%EA%B0%9C%EC%82%AC%EB%B2%95%20%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99"
  checked_at: "2026-07-26"
  note: "law.go.kr 별표1 원문 직접 대조 완료(사용자 확인, 2026-07-26). <개정 2021.12.30.>. 임대차 요율표와 별개(매매가 더 높은 요율)."
  bands:
    - upto: 50000000       # 5천만원 미만
      rate: 0.006
      cap: 250000
    - upto: 200000000      # 5천만원 ~ 2억원 미만
      rate: 0.005
      cap: 800000
    - upto: 900000000      # 2억원 ~ 9억원 미만
      rate: 0.004
      cap: null
    - upto: 1200000000     # 9억원 ~ 12억원 미만
      rate: 0.005
      cap: null
    - upto: 1500000000     # 12억원 ~ 15억원 미만
      rate: 0.006
      cap: null
    - upto: null           # 15억원 이상
      rate: 0.007
      cap: null

# 취득세 — 지방세법 제11조 1항 8호(유상거래 주택, 법률 제19230호 2023.3.14 시행).
# 전용면적 85㎡ 이하 + 비조정지역 1주택 가정(농특세 면제). 지방교육세는 §151①1호 단서에 따라
# 취득세율×1/2×20%(=취득세율×10%)로 계산되므로, 합산 실효세율 = 취득세율×1.1 로 항상 일정.
# 가·나·다 3단계: 6억 이하 1% 고정 / 6~9억 (가액÷3억×2−3)% 선형 / 9억 초과 3% 고정.
# law.go.kr 원문 직접 대조 완료(사용자 확인, 2026-07-26). "매매" 갈래에서 max_price 기준 조회.
acquisition:
  source_url: "https://casenote.kr/법령/지방세법/제11조"
  checked_at: "2026-07-26"
  note: "6억 이하 단일 근사값(0.011)만 쓰던 걸 실제 3단계 법정 구간으로 교체. 6~9억 구간은 매매 갈래에서 실제로 발생(예: max_price 7.7억 케이스 기존 654만원→구간표 적용 시 약 1,660만원, 약 2.5배 차이)."
  low_threshold: 600000000    # 6억원
  high_threshold: 900000000   # 9억원
  low_rate: 0.01               # 6억 이하: 1%
  high_rate: 0.03              # 9억 초과: 3%
  edu_tax_ratio: 0.1           # 지방교육세 = 취득세율 × 10%
