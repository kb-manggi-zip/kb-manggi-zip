    guidance: "임대인 본인이나 직계존비속의 실거주는 갱신 거절 사유에 해당할 수 있어요. 실제 거주하지 않으면 손해배상 청구가 가능해요."
    citation: "주택임대차보호법 제6조의3 제1항 제8호, 제5항"
    checked_at: "2026-07-31"
    branch_hint:
