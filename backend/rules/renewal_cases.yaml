# 갱신 상황 결정표 — resolver가 이 표만 읽어 조합(if-else 트리 금지, 선언적).
# guidance/citation/branch_hint 문구는 원문 그대로 출력(재작성·요약·LLM 생성 금지). checked_at: null 이면 로드 시 검증 경고.
# unknown 은 결정표에 없음 — 계산 미반영 + consultNote 경로로만 흐른다.
# branch_hint: 상황이 3갈래(renewal/move/purchase) 각각에 갖는 의미(표시 계층). tone=favorable|uncertain|consider|neutral.
#   null 이면 그 갈래에 힌트 미표시. applied(승인·requires 통과) 케이스만 전파.
version: 1
cases:
  - id: notice_deadline_passed
    priority: 100
    requires: { noticeDaysLeft: "< 0" }
    effect: { cap_pct: 0 }
    guidance: "통보기한이 지나 임대인이 통보하지 않았다면 동일 조건 묵시적 갱신(인상 0%)이 원칙이에요."
    citation: "주택임대차보호법 제6조"
    checked_at: "2026-07-31"
    branch_hint:
      renewal: { tone: favorable, text: "통보가 없었다면 같은 조건으로 계속 사는 것이 원칙이라, 지금은 갱신이 가장 가벼워요." }
      move: null
      purchase: null

  - id: renewal_right_exhausted
