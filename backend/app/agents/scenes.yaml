# 원칙: 콘텐츠(사진·캡션)는 여기, 숫자(monthlyCost)는 아래 monthly_cost 값.
#   - branch(갱신/이사/매매) → base 기본 씬.
#   - regions[<regionId>][<branch>] 가 있으면 지역별 씬을 우선 사용, 없으면 base 폴백.
#   - regionId 는 프론트 Region.id 와 동일(예: mapo, mapo-m). '-m' 접미사 = 월세 후보 지역.
# 팀 페르소나/씬 정리본이 오면 이 파일만 교체하면 된다(코드 수정 불필요).
# 프론트 참조본 frontend/src/data/scenes.ts 와 내용 동기화 유지(compare.ts↔compare.py 규칙과 동일).
# STUB: 아직 LLM 내레이션 미연동 — 결정론적 fixture. 실 데이터(경로·POI·물가)는 RESEARCH.md PART C5.

