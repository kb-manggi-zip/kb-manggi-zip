# 하루 시뮬레이션 씬 레지스트리 — narrator.py가 로드.
# ─────────────────────────────────────────────────────────────
# ⚠️ Trust Layer(L1): 캡션은 (a) 공공 랜드마크 명칭, (b) 지하철 노선 공개정보,
#    (c) 시간대·동선 중립 연결어로만. 가격·비용·상태(활기/노포/즐비/소음 등) 단정 금지.
#    실측 수치(통근·상권·실거래)는 발품 하단 내레이션(narrator)과 fact 칩이 담당한다.
#   - branch(갱신/이사/매매) → base 기본 씬.
#   - regions[<regionId>][<branch>] 가 있으면 지역별 씬을 우선 사용, 없으면 base 폴백.
#   - regionId 는 프론트 Region.id 와 동일(예: mapo, mapo-m). '-m' 접미사 = 월세 후보 지역.
# 프론트 참조본 frontend/src/data/scenes.ts 와 내용 동기화 유지.

monthly_cost:          # 시나리오별 월 생활비(참고용 예시값 — 계산 아님)
  갱신: 900000
  이사: 900000
  매매: 1400000

