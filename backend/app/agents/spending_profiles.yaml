# 소비 프로필 리소스 — 하루 시뮬 '온라인 발품' 내레이션 그라운딩용.
# ─────────────────────────────────────────────────────────────
# PoC: 페르소나(가구) 기반 '가정' 프로필. 실서비스: **KB 카드/소비 데이터로 교체**(같은 shape).
#   → narrator.narrate_lifestyle()가 이 파일 + 동네 실데이터로 생성형 내레이션을 만든다.
# ⚠️ 여기 값은 '생성 톤 참고용 가정'일 뿐, 고객 화면의 금융 숫자(compare)와 무관하다.
#     내레이션은 정성적으로만(금액·개수 단정 금지) — 정확 facts(경로·POI·물가)는 API로 갈아끼울 seam.

base: >
  너는 사용자의 소비·생활 패턴에 맞춰 '이 동네에서의 하루'를 생생하게 그려주는 주거 도우미다.
  주어진 동네 특징과 소비 성향만 근거로, 2~3문장의 짧은 대화체로 쓴다(마크다운·불릿·제목 금지).
  구체적 금액·개수를 단정하지 말고("아메리카노 2,500원" X) 정성적으로 그린다("아침 커피 습관 이어가기 좋아요" O).
  결론·권유·과장은 하지 않는다. 없는 사실은 지어내지 않는다.

# 가구 유형별 소비/생활 성향 (정성적)
# ✅ 2026-07-27: 경기도 카드소비 데이터(연령대 세그먼트 근사)로 "소비" traits만 근거 보강.
#    "개인화"가 아니라 "연령대 세그먼트 근사" — 방법론·한계·검증 로그는 ref/카드소비_세그먼트근사_분석.md 참고.
#
#    ⚠️ traits/keywords 안에는 성격이 다른 두 종류가 섞여 있다:
#    - 소비(카드데이터로 검증 가능) — 아래 "근거:" 주석 있는 항목만 실제 검증됨
#    - 주거선호(카드데이터로 절대 검증 불가 — 통근·역세권·학군·평형 등) — 여전히 순수 가정,
#      추후 폼에 선호도 필드가 생기면 그걸로 교체될 자리. 카드데이터로 확인 시도조차 무의미함
#      (소비 카테고리가 아니라 주거 선택 기준이라 애초에 이 데이터의 관측 대상이 아님).
profiles:
  # workplace = 통근시간 발품용 대표 직장 좌표(가구 유형별 가정 — PoC. 실서비스는 사용자 입력/마이데이터).
  신혼:
    # 소비 근거: 30대 카드소비 데이터에서 유아용품(69.9%/53.9%)·유아교육(65.2%/47.1%)·숙박(42.4%) 점유율이
    #   뚜렷하게 높음 (연령대 근사, 2026-03 경기도). "가전·가구"는 40대가 더 높게 나와 30대 특이 근거로 제외.
    traits: ["주말 나들이·숙박 지출", "유아용품·유아교육 준비 지출 시작", "인터넷쇼핑 비중 큼"]
    # 아래는 주거선호(가정) — 카드데이터 검증 대상 아님
    keywords: ["투룸", "대형마트 근접", "주말 나들이 코스"]
    workplace: {name: "여의도(금융권)", lat: 37.5219, lng: 126.9245}
  자녀:
    # 소비 근거: 40대 카드소비 데이터에서 입시학원(92.3%/88.9%)·외국어학원(83.3%/79.4%)·예체능학원(74.2%/67.3%)이
    #   압도적. 종합소매점(51.2%/42.4%)·한식(48.3%/41.3%)도 40대 최고치라 "정기 장보기"·"가족 외식"도 근거 확보.
    traits: ["정기 장보기 비중 큼", "교육·학원 지출", "가족 외식 빈도 높음"]
    # 아래는 주거선호(가정) — 카드데이터 검증 대상 아님 ("소아과" 등은 카테고리 자체가 없어 확인 불가)
    keywords: ["학군", "도보 통학", "소아과·마트 접근성"]
    workplace: {name: "상암DMC", lat: 37.5796, lng: 126.8896}
  "1인":
    # 소비 근거: 20대 카드소비 데이터에서 취미/오락(36.2%/42.6%)이 세 그룹 중 유일하게 최고치.
    #   "편의점"은 매칭 카테고리 없어 확인 불가(제외). "카페"는 오히려 40대가 더 높게 나와 청년 특이 근거로 부적절,
    #   대신 패스트푸드(23.5%/28.7%)로 대체 — 배달 위주 식습관의 근사 지표로 판단.
    traits: ["패스트푸드·배달 음식 위주 식사", "취미·여가·구독 지출 활발", "짧은 통근 선호"]
    # 아래는 주거선호(가정) — 카드데이터 검증 대상 아님
    keywords: ["역세권", "소형 평면", "생활 편의 밀집"]
    workplace: {name: "판교(IT)", lat: 37.3948, lng: 127.1112}

# 매칭 안 될 때 기본값
default:
  traits: ["생활 편의 중심 소비"]
  keywords: ["교통", "마트", "생활 인프라"]
  workplace: {name: "시청", lat: 37.5663, lng: 126.9779}
