    keywords: ["학군", "도보 통학", "소아과·마트 접근성"]
    workplace: {name: "상암DMC", lat: 37.5796, lng: 126.8896}
  청년:
    traits: ["카페·배달·구독 잦음", "대중교통 중심 이동", "야간 상권 이용"]
    keywords: ["역세권", "1인 상권", "심야 편의"]
    workplace: {name: "강남역", lat: 37.4979, lng: 127.0276}
  "1인":
    traits: ["편의점·혼밥·배달 잦음", "문화·구독 지출", "짧은 통근 선호"]
    keywords: ["역세권", "소형 평면", "생활 편의 밀집"]
    workplace: {name: "판교(IT)", lat: 37.3948, lng: 127.1112}

