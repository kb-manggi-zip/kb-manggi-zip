# 지역 대표 데이터(수기) — 하루 '온라인 발품' 내레이션 그라운딩용.
# ─────────────────────────────────────────────────────────────
# narrator는 이 YAML(수기) + DB(자동 상권집계)를 병합해 프롬프트에 주입한다.
#   · grocery/dining_cafe/leisure = **자동**: scripts/refresh/refresh_regions.py (소상공인 상권 API) → trades_store.region_facts
#   · transport/price_level/notes = **수기**: 이 파일 (경로·물가 등 API로 자동화 어려운 항목)
#   → DB가 grocery 등을 덮고, transport는 이 파일이 제공. 둘 다 없으면 이름+태그 폴백.
#   - 자동 채우기:  (.env SBIZ_API_KEY 추가 후)  TRADES_DB=data/trades.demo.db python scripts/refresh/refresh_regions.py
# ⚠️ 라이프스타일 근거용이며 금융 숫자(compare)와 무관. 정성적으로만 쓰인다.
# ⚠️ 임의 작문 금지 — 카카오맵·ODsay·참가격 등 확인 가능한 것만. (자세히: docs/지역데이터_채우기_가이드.md)
#
# 스키마: facts[<regionId>] =
#   name          : "구 동" (한글, 표시 확인용)
#   transport     : [ "역/노선 도보 N분", "주요 목적지까지 소요" ]   # ODsay/카카오
#   grocery       : [ "전통시장/마트 접근성" ]                       # 카카오맵
#   dining_cafe   : [ "대표 상권/카페거리/먹자골목" ]                # 카카오맵
#   leisure       : [ "공원/하천/문화시설" ]                         # 카카오맵
#   price_level   : "저" | "중" | "고"   # 물가 체감(참가격 등 근거, 선택)
#   notes         : "한 줄 분위기(선택)"
#
# 데모 대상 9개 regionId (프론트 Region.id와 동일):
#   매매: mapo(합정동) · eunpyeong(녹번동) · dobong(창동)
#   전세: seongbuk(길음동) · nowon(상계동) · jungnang(면목동)
#   월세: mapo-m(망원동) · seodaemun-m(홍제동) · seongbuk-m(보문동)

facts:
  # ── 예시 1개 (형태 참고용 — 실제 값은 출처 대조해 팀원이 채움) ──────────
  mapo-m:
    name: "마포구 망원동"
    transport: ["6호선 망원역 도보 6분", "합정 환승 없이 시청 약 28분"]
    grocery: ["망원시장(전통시장) 도보권", "대형마트 차량 약 10분"]
    dining_cafe: ["망리단길 카페 밀집", "망원시장 먹자골목"]
    leisure: ["한강공원 망원지구 자전거 약 5분"]
    price_level: "중"
    notes: "젊은층 많고 야간 활기"

  # ── 아래 8개를 채우면 자동 반영됨 (regionId만 맞추면 코드 수정 불필요) ──
  # mapo: { name: "마포구 합정동", transport: [...], ... }
  # eunpyeong: { ... }
  # dobong: { ... }
  # seongbuk: { ... }
  # nowon: { ... }
  # jungnang: { ... }
  # seodaemun-m: { ... }
  # seongbuk-m: { ... }
