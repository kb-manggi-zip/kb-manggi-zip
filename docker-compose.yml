# KB 만기상담소 — 백엔드 + Postgres
# 사용: docker compose up --build   → http://localhost:8000/health
#
# 로컬(도커 없이) 데모는 backend/README.md의 venv 방법을 쓰세요.
# 이 compose는 "제출작다운" Postgres 구성 + 향후 데이터 적재용입니다.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kb:kb@db:5432/kb
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # LLM/외부데이터 키는 .env로 주입 (없으면 폴백 동작)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      MOLIT_API_KEY: ${MOLIT_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/cache:/app/cache      # 외부 API 파일 캐시 영속
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
